<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Aziz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.50),
                    rgba(0, 0, 0, 0.50)
                ),
                url("{{ url_for('static', filename='background.jpg') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }

        .welcome {
            padding: 35px;
            max-width: 700px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px black;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            text-shadow: 1px 1px 4px black;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;

            background-color: white;
            color: black;

            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;

            transition: 0.3s;
        }

        .button:hover {
            background-color: #cccccc;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }

            .welcome {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome">
        <h1>Selamat Datang di Website Aziz</h1>

        <p>
            Selamat datang di website pribadi saya.
            Terima kasih telah mengunjungi Website Aziz.
        </p>

        <a href="#" class="button">Mulai Menjelajah</a>
    </div>

</body>
</html>
